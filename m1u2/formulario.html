<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>

<body>
    <h3>Formulario de Contacto</h3>
    <form action="#" method="post">
        <!-- Texto corto -->
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required><br><br>

        <label for="apellido">Apellido:</label><br>
        <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required><br><br>

        <!-- Correo -->
        <label for="email">Correo Electrónico:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <!-- Contraseña -->
        <label for="pass">Contraseña:</label><br>
        <input type="password" id="pass" name="pass" required><br><br>

        <!-- Menú desplegable -->
        <label for="opciones">Selecciona una opción:</label><br>
        <select id="opciones" name="opciones">
            <option value="opcion1">Opción 1</option>
            <option value="opcion2">Opción 2</option>
        </select><br><br>

        <!-- Casillas de verificación -->
        <label>Intereses:</label><br>
        <input type="checkbox" id="int1" name="intereses" value="leer">
        <label for="int1">Leer</label><br>
        <input type="checkbox" id="int2" name="intereses" value="programar">
        <label for="int2">Programar</label><br><br>

        <!-- Botón de selección (circular) -->
        <label>¿Te gusta esta web?</label><br>
        <input type="radio" id="si" name="respuesta" value="si">
        <label for="si">Sí</label><br>
        <input type="radio" id="no" name="respuesta" value="no">
        <label for="no">No</label><br><br>

        <!-- Botón de enviar -->
        <input type="submit" value="Enviar">
    </form>
</body>

</html>
